<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meine Rezepte</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #FFC0CB;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --accent: pink;
      --accent-dark: #c85b7d;
      --border: #f1d8df;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 28px;
      background: var(--bg);
      color: var(--text);
    }

    a {
      color: blue;
      text-decoration: underline;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.15;
    }

    .title-text {
      color: white;
    }

    .stats {
      margin-top: 8px;
      color: white;
      font-weight: 700;
      font-size: 17px;
    }

    .page-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    .nav-button {
      background: white;
      color: var(--accent-dark);
      border: 2px solid white;
      font-weight: 700;
      margin: 0;
    }

    .nav-button.active {
      background: var(--accent-dark);
      color: white;
      border-color: var(--accent-dark);
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .section-head h2 {
      margin: 0;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover {
      opacity: 0.9;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .recipe-tile {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    .recipe-tile-header {
      min-height: 100px;
      padding: 18px;
      background: rgba(255, 192, 203, 0.38);
      border-bottom: 1px solid var(--border);
    }

    .recipe-tile h3 {
      font-size: 24px;
      line-height: 1.18;
      margin: 0;
    }

    .recipe-tile-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .small {
      color: var(--muted);
      font-size: 14px;
    }

    .label {
      margin: 0 0 8px;
      font-weight: 700;
      color: var(--accent-dark);
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tag-chip {
      display: inline-block;
      background: #f7dce5;
      color: var(--accent-dark);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
    }

    .recipe-preview {
      color: #333;
      font-size: 15px;
      line-height: 1.45;
      margin: 0 0 16px;
    }

    .primary-btn {
      margin-top: auto;
      background: var(--accent-dark);
    }

    .recipe-details {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .recipe-details h4 {
      margin: 12px 0 6px;
    }

    .content-text {
      font-size: 15px;
      color: #000;
      line-height: 1.45;
    }

    .hidden {
      display: none;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .actions button {
      margin: 0;
    }

    .secondary-btn {
      background: white;
      color: var(--accent-dark);
      border: 1px solid var(--border);
    }

    .empty-state {
      background: white;
      border-radius: 18px;
      padding: 20px;
      color: var(--muted);
    }

    @media (max-width: 950px) {
      .recipe-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {
      body {
        padding: 18px;
      }

      .page-nav {
        flex-direction: column;
      }

      .recipe-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="hero">
      <h1>
        ⭐️🌸🧸🌿<br>
        <span class="title-text">MY RECIPES</span><br>
        ⭐️🌸🧸🌿
      </h1>
      <div class="stats" id="recipeStats">0 gespeichert</div>
    </header>

    <nav class="page-nav">
      <button class="nav-button active" id="nav-new" onclick="showPage('new')">New Recipe</button>
      <button class="nav-button" id="nav-all" onclick="showPage('all')">All Recipes</button>
      <button class="nav-button" id="nav-search" onclick="showPage('search')">Search</button>
    </nav>

    <section id="page-new" class="page active">
      <div class="card">
        <h2>New Recipe</h2>
        <input type="text" id="name" placeholder="Name" />
        <input type="text" id="tags" placeholder="Tags, z. B. Pasta, Einfach, Vegetarisch" />
        <textarea id="ingredients" placeholder="What"></textarea>
        <textarea id="instructions" placeholder="How"></textarea>
        <button onclick="saveRecipe()">Save ⭐️</button>
      </div>
    </section>

    <section id="page-all" class="page">
      <div class="section-head">
        <h2>All Recipes</h2>
        <span class="small" id="allCount"></span>
      </div>

      <div id="recipeListAll" class="recipe-grid"></div>
    </section>

    <section id="page-search" class="page">
      <div class="card">
        <h2>Search</h2>
        <input type="text" id="searchTitle" placeholder="Title ..." oninput="renderRecipes()" />
        <input type="text" id="searchTags" placeholder="Tags ..." oninput="renderRecipes()" />
        <input type="text" id="searchIngredients" placeholder="Ingredients ..." oninput="renderRecipes()" />
      </div>

      <div class="section-head">
        <h2>Search Results</h2>
        <span class="small" id="searchCount"></span>
      </div>

      <div id="recipeListSearch" class="recipe-grid"></div>
    </section>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://kdmdujfykezsyadtskcv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_qYiTwL6d6p4r-dzbK5Bm8A_qS28j4zk";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let recipes = [];
    let editId = null;

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function linkify(text) {
      if (!text) return "";

      const safeText = escapeHtml(text);

      return safeText
        .replace(
          /(https?:\/\/[^\s<]+)/g,
          '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
        )
        .replace(/\n/g, "<br>");
    }

    function shortText(text, maxLength = 120) {
      const clean = String(text || "").replace(/\s+/g, " ").trim();

      if (clean.length <= maxLength) {
        return escapeHtml(clean);
      }

      return escapeHtml(clean.slice(0, maxLength)) + "...";
    }

    function renderTagChips(tags) {
      const tagArray = String(tags || "")
        .split(/[;,]/)
        .map(tag => tag.trim())
        .filter(Boolean);

      if (tagArray.length === 0) {
        return '<span class="tag-chip">Ohne Tags</span>';
      }

      return tagArray
        .map(tag => `<span class="tag-chip">${escapeHtml(tag)}</span>`)
        .join("");
    }

    function createRecipeCard(recipe, area) {
      return `
        <article class="recipe-tile">
          <div class="recipe-tile-header">
            <p class="small label">Rezept</p>
            <h3>${escapeHtml(recipe.title || "Ohne Titel")}</h3>
          </div>

          <div class="recipe-tile-body">
            <div class="tag-row">
              ${renderTagChips(recipe.tags)}
            </div>

            <p class="recipe-preview">
              ${shortText(recipe.ingredients || "Keine Zutaten eingetragen.")}
            </p>

            <button class="primary-btn" onclick="toggleDetails(${recipe.id}, '${area}')">
              Details ansehen
            </button>

            <div id="details-${area}-${recipe.id}" class="recipe-details hidden">
              <h4>Zutaten</h4>
              <p class="content-text">${linkify(recipe.ingredients || "")}</p>

              <h4>Zubereitung</h4>
              <p class="content-text">${linkify(recipe.instructions || "")}</p>

              <div class="actions">
                <button class="secondary-btn" onclick="editRecipe(${recipe.id})">Bearbeiten</button>
                <button class="secondary-btn" onclick="deleteRecipe(${recipe.id})">Löschen</button>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderRecipeGrid(element, recipeArray, area, emptyText) {
      element.innerHTML = "";

      if (recipeArray.length === 0) {
        element.innerHTML = `<div class="empty-state">${emptyText}</div>`;
        return;
      }

      element.innerHTML = recipeArray
        .map(recipe => createRecipeCard(recipe, area))
        .join("");
    }

    window.toggleDetails = function (id, area) {
      const details = document.getElementById(`details-${area}-${id}`);

      if (!details) {
        return;
      }

      details.classList.toggle("hidden");
    };

    window.showPage = function (pageName) {
      document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
      });

      document.querySelectorAll(".nav-button").forEach(button => {
        button.classList.remove("active");
      });

      document.getElementById(`page-${pageName}`).classList.add("active");
      document.getElementById(`nav-${pageName}`).classList.add("active");
    };

    async function loadRecipes() {
      const { data, error } = await supabase
        .from("recipes")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Fehler beim Laden:", error);
        alert("Rezepte konnten nicht geladen werden.");
        return;
      }

      recipes = data || [];
      renderRecipes();
    }

    window.saveRecipe = async function () {
      const title = document.getElementById("name").value.trim();
      const tags = document.getElementById("tags").value.trim();
      const ingredients = document.getElementById("ingredients").value.trim();
      const instructions = document.getElementById("instructions").value.trim();

      if (!title || !ingredients || !instructions) {
        alert("Bitte mindestens Name, Zutaten und Zubereitung ausfüllen.");
        return;
      }

      if (editId === null) {
        const { error } = await supabase.from("recipes").insert([
          { title, tags, ingredients, instructions }
        ]);

        if (error) {
          console.error("Fehler beim Speichern:", error);
          alert("Rezept konnte nicht gespeichert werden.");
          return;
        }
      } else {
        const { error } = await supabase
          .from("recipes")
          .update({ title, tags, ingredients, instructions })
          .eq("id", editId);

        if (error) {
          console.error("Fehler beim Aktualisieren:", error);
          alert("Rezept konnte nicht aktualisiert werden.");
          return;
        }

        editId = null;
      }

      document.getElementById("name").value = "";
      document.getElementById("tags").value = "";
      document.getElementById("ingredients").value = "";
      document.getElementById("instructions").value = "";

      await loadRecipes();
      showPage("all");
    };

    window.renderRecipes = function () {
      const allList = document.getElementById("recipeListAll");
      const searchList = document.getElementById("recipeListSearch");

      const searchTitle = document.getElementById("searchTitle").value.toLowerCase();
      const searchTags = document.getElementById("searchTags").value.toLowerCase();
      const searchIngredients = document.getElementById("searchIngredients").value.toLowerCase();

      const filteredRecipes = recipes.filter(recipe => {
        const titleMatch = (recipe.title || "").toLowerCase().includes(searchTitle);

        const recipeTags = (recipe.tags || "")
          .toLowerCase()
          .split(/[;,]/)
          .map(t => t.trim())
          .filter(t => t);

        const searchTagsArray = searchTags
          .toLowerCase()
          .split(/[;,]/)
          .map(t => t.trim())
          .filter(t => t);

        const tagsMatch =
          searchTagsArray.length === 0 ||
          searchTagsArray.every(searchTag =>
            recipeTags.some(recipeTag => recipeTag.includes(searchTag))
          );

        const ingredientsText = (recipe.ingredients || "").toLowerCase();

        const searchIngredientsArray = searchIngredients
          .toLowerCase()
          .split(/[,\n;]/)
          .map(i => i.trim())
          .filter(i => i);

        const ingredientsMatch =
          searchIngredientsArray.length === 0 ||
          searchIngredientsArray.every(searchIngredient =>
            ingredientsText.includes(searchIngredient)
          );

        return titleMatch && tagsMatch && ingredientsMatch;
      });

      document.getElementById("recipeStats").textContent =
        `${recipes.length} gespeichert`;

      document.getElementById("allCount").textContent =
        `${recipes.length} Rezepte`;

      document.getElementById("searchCount").textContent =
        `${filteredRecipes.length} Treffer`;

      renderRecipeGrid(
        allList,
        recipes,
        "all",
        "Noch keine Rezepte gespeichert."
      );

      renderRecipeGrid(
        searchList,
        filteredRecipes,
        "search",
        "Keine Rezepte gefunden."
      );
    };

    window.deleteRecipe = async function (id) {
      if (!confirm("Willst du dieses Rezept wirklich löschen?")) return;

      const { error } = await supabase
        .from("recipes")
        .delete()
        .eq("id", id);

      if (error) {
        console.error("Fehler beim Löschen:", error);
        alert("Rezept konnte nicht gelöscht werden.");
        return;
      }

      await loadRecipes();
    };

    window.editRecipe = function (id) {
      const recipe = recipes.find(r => r.id === id);

      if (!recipe) {
        return;
      }

      document.getElementById("name").value = recipe.title || "";
      document.getElementById("tags").value = recipe.tags || "";
      document.getElementById("ingredients").value = recipe.ingredients || "";
      document.getElementById("instructions").value = recipe.instructions || "";

      editId = id;
      showPage("new");
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    loadRecipes();
  </script>
</body>
</html>
